<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Moda Center</title>
  <style>
    :root {
      --purple: #6d2ae8;
      --purple-dark: #3a148f;
      --orange: #ff8a1d;
      --bg: #f6f3ff;
      --card: #ffffff;
      --text: #1c1a2a;
      --muted: #6f6686;
      --line: #e8e1ff;
      --danger: #d9485f;
      --success: #1b9e67;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #efe8ff 0%, #f7f7fb 100%);
      color: var(--text);
    }
    .admin-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding: 20px 24px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: white;
      border-radius: 22px;
      box-shadow: 0 16px 30px rgba(68, 34, 140, 0.18);
    }
    .topbar h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2.3rem);
    }
    .topbar .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: var(--orange);
      color: white;
    }
    .btn.secondary {
      background: rgba(255,255,255,.14);
      color: white;
      border: 1px solid rgba(255,255,255,.26);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(108, 87, 184, 0.08);
    }
    .summary-card .label {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 10px;
    }
    .summary-card .value {
      font-size: clamp(1.5rem, 2vw, 2.2rem);
      font-weight: 800;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(108, 87, 184, 0.08);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1.3rem;
    }
    .stores-list {
      display: grid;
      gap: 16px;
    }
    .store-card {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 18px;
      align-items: center;
      border: 1px solid var(--line);
      background: #fbfaff;
      border-radius: 18px;
      padding: 18px;
    }
    .store-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 16px;
      background: #f0ebff;
    }
    .store-card h3 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }
    .store-card p {
      margin: 4px 0;
      color: var(--muted);
    }
    .store-card .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .tag {
      display: inline-block;
      background: #efe5ff;
      color: var(--purple-dark);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .store-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 126px;
    }
    .btn.danger {
      background: #ffe7eb;
      color: #b11734;
    }
    .btn.success {
      background: #e8fff5;
      color: var(--success);
    }
    .empty-state {
      padding: 26px 18px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
      background: #faf7ff;
    }
    @media (max-width: 700px) {
      .store-card {
        grid-template-columns: 1fr;
      }
      .store-actions {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="topbar">
      <div>
        <h1>PAINEL ADMINISTRADOR</h1>
      </div>
      <div class="actions">
        <button id="refreshStores" class="btn secondary" type="button">Atualizar</button>
        <button id="adminLogout" class="btn primary" type="button">Sair</button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-card">
        <div class="label">Lojas ativas</div>
        <div id="storesCount" class="value">0</div>
      </div>
      <div class="summary-card">
        <div class="label">Produtos no sistema</div>
        <div id="productsCount" class="value">0</div>
      </div>
      <div class="summary-card">
        <div class="label">Pedidos registrados</div>
        <div id="ordersCount" class="value">0</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Lojas cadastradas</h2>
      </div>
      <div id="storesList" class="stores-list"></div>
    </section>
  </main>

  <script>
    const SESSION_KEY = "modaCenterSession";
    const STORES_KEY = "modaCenterStores";
    const PRODUCTS_KEY = "modaCenterProducts";
    const ORDERS_KEY = "modaCenterOrders";

    const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    const storesList = document.getElementById("storesList");
    const storesCount = document.getElementById("storesCount");
    const productsCount = document.getElementById("productsCount");
    const ordersCount = document.getElementById("ordersCount");

    if (!session || session.profile !== "administrador") {
      window.location.href = "index.html?login=1";
    }

    function readJson(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
      } catch (error) {
        return fallback;
      }
    }

    function renderStores() {
      const stores = readJson(STORES_KEY, {});
      const products = readJson(PRODUCTS_KEY, {});
      const orders = readJson(ORDERS_KEY, []);
      const entries = Object.entries(stores);

      storesCount.textContent = String(entries.length);
      productsCount.textContent = String(Object.values(products).reduce((total, item) => total + (Array.isArray(item) ? item.length : 0), 0));
      ordersCount.textContent = String(Array.isArray(orders) ? orders.length : 0);

      if (!entries.length) {
        storesList.innerHTML = '<div class="empty-state">Nenhuma loja cadastrada no momento.</div>';
        return;
      }

      storesList.innerHTML = entries.map(([ownerId, store]) => {
        const items = Array.isArray(products[ownerId]) ? products[ownerId] : [];
        const tags = Array.isArray(store.segments) && store.segments.length ? store.segments : ["Loja"];
        return `
          <article class="store-card">
            <img src="${store.image || 'assets/images/logo.png'}" alt="${store.name || 'Loja'}" onerror="this.onerror=null;this.src='assets/images/logo.png'" />
            <div>
              <h3>${store.name || "Loja sem nome"}</h3>
              <p>Proprietário: ${ownerId}</p>
              <p>Produtos: ${items.length}</p>
              <div class="tags">
                ${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
              </div>
            </div>
            <div class="store-actions">
              <button class="btn success" type="button" data-action="view" data-owner="${ownerId}">Ver</button>
              <button class="btn danger" type="button" data-action="delete" data-owner="${ownerId}">Apagar</button>
            </div>
          </article>
        `;
      }).join("");

      storesList.querySelectorAll("[data-action='view']").forEach(button => {
        button.addEventListener("click", () => {
          const ownerId = button.dataset.owner;
          const storesData = readJson(STORES_KEY, {});
          const store = storesData[ownerId];
          if (!store) return;
          alert(`${store.name}\n\nSegmentos: ${(store.segments || []).join(', ') || 'Sem segmento'}`);
        });
      });

      storesList.querySelectorAll("[data-action='delete']").forEach(button => {
        button.addEventListener("click", async () => {
          const ownerId = button.dataset.owner;
          const confirmed = window.confirm(`Deseja apagar a loja selecionada?\nIsso também removerá os produtos vinculados.`);
          if (!confirmed) return;

          try {
            const response = await fetch(`/api/stores/${encodeURIComponent(ownerId)}`, {
              method: "DELETE",
              headers: { "Content-Type": "application/json" }
            });
            if (!response.ok) {
              throw new Error("Falha ao remover loja");
            }

            const allStores = readJson(STORES_KEY, {});
            delete allStores[ownerId];
            localStorage.setItem(STORES_KEY, JSON.stringify(allStores));

            const allProducts = readJson(PRODUCTS_KEY, {});
            delete allProducts[ownerId];
            localStorage.setItem(PRODUCTS_KEY, JSON.stringify(allProducts));

            window.location.reload();
          } catch (error) {
            alert("Não foi possível apagar a loja no momento.");
          }
        });
      });
    }

    document.getElementById("refreshStores").addEventListener("click", renderStores);
    document.getElementById("adminLogout").addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      window.location.href = "index.html?login=1";
    });

    renderStores();
  </script>
</body>
</html>
